name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts
      - name: Test plugin
        shell: bash
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee test.log; then
            node -e "const text = require('node:fs').readFileSync('test.log', 'utf8').slice(-24000); process.stdout.write('::error::' + text.replace(/%/g, '%25').replace(/\\r/g, '%0D').replace(/\\n/g, '%0A') + '\\n')"
            exit 1
          fi
      - run: npm run test:child-bridge
      - run: npm pack --dry-run
