name: Release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag to stage (for example v0.1.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate version tag and release notes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { name, version } = require('./package.json');
          const tag = process.env.GITHUB_REF_NAME;
          if (process.env.GITHUB_REF_TYPE !== 'tag' || name !== '@wcoekaer/homebridge-tesla-powerpack' || !/^\d+\.\d+\.\d+$/.test(version) || tag !== `v${version}`) {
            throw new Error('Select a stable version tag matching package.json');
          }
          if (!fs.readFileSync(`releases/${tag}.md`, 'utf8').trim()) throw new Error('Release notes are required');
          NODE
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:child-bridge
      - name: Build plugin archive and checksum
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          cd artifacts
          sha256sum wcoekaer-homebridge-tesla-powerpack-*.tgz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/wcoekaer-homebridge-tesla-powerpack-*.tgz artifacts/SHA256SUMS \
            --verify-tag \
            --title "Homebridge Tesla Powerpack $GITHUB_REF_NAME" \
            --notes-file "releases/$GITHUB_REF_NAME.md" \
            --latest

  stage-npm:
    name: Stage npm package for approval
    needs: release
    if: >-
      ${{ !cancelled() && (
        needs.release.result == 'success' ||
        (github.event_name == 'release' && !github.event.release.prerelease) ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require a stable version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Enter a published stable release tag (for example v0.1.0).' >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.16.0 --ignore-scripts
      - name: Download the published release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease > artifacts/release.json
          gh release download "$RELEASE_TAG" \
            --pattern "wcoekaer-homebridge-tesla-powerpack-${RELEASE_TAG#v}.tgz" \
            --pattern SHA256SUMS --dir artifacts
      - name: Verify and stage on npm using OIDC
        run: node scripts/stage-npm-release.cjs "$RELEASE_TAG" artifacts
